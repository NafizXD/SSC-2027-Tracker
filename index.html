/* Orbit · a quiet place to understand your progress */
:root{--bg:#f5f6f3;--surface:#fff;--side:#fcfcfa;--text:#25352e;--muted:#6e7971;--subtle:#8a948b;--line:#e7eae4;--accent:#34634d;--accent-hover:#274e3c;--tint:#eaf0e8;--hero:#edf0e6;--strong:#5b9479;--building:#d5a45d;--weak:#cf8380;--unknown:#e3e6df;--shadow:0 3px 16px rgba(36,51,41,.025);--radius:16px;--ring:0 0 0 3px #34634d26;font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Bengali',sans-serif;color:var(--text);background:var(--bg);font-synthesis:none;scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;font-size:14px;line-height:1.5}button,input,select,textarea{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button,a{touch-action:manipulation}button{color:inherit}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--accent);text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:0;background:none}input,textarea,select{color:var(--text)}h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{font-weight:600}h1{font-size:29px;line-height:1.25;letter-spacing:-1px}h2{font-size:18px;letter-spacing:-.45px}h3{font-size:15px;letter-spacing:-.2px}p{color:var(--muted)}svg{display:inline-block;flex-shrink:0;vertical-align:middle}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}small{font-size:12px}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.muted{color:var(--muted)}.tiny{font-size:11px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.flex{display:flex;align-items:center}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.gap-8{gap:8px}.gap-12{gap:12px}.nowrap{white-space:nowrap}.soft-text{color:var(--muted);font-size:12px}.subheading{margin-top:7px;font-size:13px}.spacer{flex:1}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:11px;line-height:1.4;white-space:nowrap;background:var(--surface)}.badge{font-size:11px;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:5px;white-space:nowrap;font-weight:500}.badge.unknown{background:var(--bg);color:var(--muted)}.badge.strong{background:#ecf4ef;color:#477c61}.badge.building{background:#faf3e7;color:#a57b3b}.badge.weak{background:#faefec;color:#b46c67}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}.button{display:inline-flex;justify-content:center;align-items:center;gap:9px;min-height:40px;padding:9px 15px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;font-size:12px;font-weight:500;transition:background .15s,transform .15s}.button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}.button .icon{width:16px;height:16px}.button.secondary{background:var(--surface);border-color:var(--line);color:var(--text)}.button.secondary:hover{background:var(--bg);border-color:#c8d0c6}.button.ghost{background:none;border-color:transparent;color:var(--muted)}.button.ghost:hover{background:var(--tint);color:var(--text)}.button.danger{background:#b55a54;border-color:#b55a54}.button.small{min-height:32px;padding:6px 10px;font-size:11px}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid transparent;border-radius:8px;color:var(--muted);flex-shrink:0}.icon-button:hover{background:var(--bg);color:var(--text)}.text-button{display:inline-flex;align-items:center;gap:6px;color:var(--accent);padding:3px 0;font-size:12px;font-weight:500}.text-button:hover{text-decoration:underline;text-underline-offset:4px}.text-button .icon{width:14px;height:14px}.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}.card-pad{padding:23px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.card-head h2{font-size:16px}.divider{height:1px;background:var(--line);margin:20px 0}.progress-track{height:5px;overflow:hidden;border-radius:10px;background:var(--bg)}.progress-fill{height:100%;border-radius:10px;background:var(--strong);transition:width .3s}.progress-track.large{height:7px}.pill-icon{display:gr iv>`;}

function subjectCard(s){const a=stats(s.id);return `<button class="card subject-card" data-action="subject" data-sid="${s.id}" aria-label="Open ${e(s.name)}, ${a.avg===null?'not assessed':fmt(a.avg)+' out of 10 confidence'}, ${a.pct}% topics covered"><div class="subject-top"><span class="pill-icon ${s.color}">${icon(s.icon)}</span>${icon('arrow-up','arrow')}</div><h3>${e(s.name)}</h3><p class="bn" lang="bn">${e(s.bn)}</p><div class="subject-rating">${stars(a.avg)}<span class="score-caption">${a.avg===null?'Not assessed':`<b>${fmt(a.avg)}</b> / 10`}</span></div><div class="progress-caption"><span>Topics covered</span><span>${a.pct}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${a.pct}%;background:${COLORS[s.color]}"></div></div><div class="subject-card-bottom"><span>${a.rated} / ${a.chapters} chapters rated</span><span class="flex gap-8"><span class="dot" style="color:${chartColor(band(a.avg))}"></span>${a.weak?`${a.weak} need work`:a.strong?`${a.strong} strong`:a.rated?'Keep going':'Ready to begin'}</span></div></button>`;}
function focusCard(){const picks=recommendations().slice(0,3),a=stats();if(!a.rated&&!picks.length)return `<div class="card focus-card"><div class="focus-card-symbol">${icon('target')}</div><h2>A clear place to start</h2><p class="lead">Your weak spots will show up here. First, let’s get to know your chapters.</p><div class="step-list"><div class="step"><span class="step-number">1</span><div><b>Pick a subject</b><p>Start with one you studied recently.</p></div></div><div class="step"><span class="step-number">2</span><div><b>Give it an honest rating</b><p>0 to 10 stars. No pressure.</p></div></div><div class="step"><span class="step-number">3</span><div><b>Check off the topics</b><p>Watch your progress take shape.</p></div></div></div><button class="button secondary" data-action="subject" data-sid="physics">Let’s start with Physics ${icon('arrow')}</button></div>`;return `<div class="card focus-card"><div class="between"><h2>Your next focus</h2>${icon('target')}</div><p class="lead">A short list. A manageable next step.</p>${picks.length?picks.map(c=>{const p=progress(c.id);return `<button class="focus-link" data-action="open-chapter" data-cid="${c.id}"><span class="subject-label"><span class="dot" style="color:${COLORS[c.subject.color]}"></span>${e(c.subject.name)}</span><strong>${e(c.title)}</strong><span class="focus-meta"><span class="focus-score">${p.rating===null?'Pinned for revision':`${p.rating} / 10 confidence`}</span>${icon('arrow','arrow')}</span></button>`;}).join(''):`<div style="padding:24px 0;font-size:11px;color:var(--muted)">No low ratings right now. Keep assessing the chapters you haven’t rated yet.</div>`}<button class="text-button" style="margin-top:18px" data-action="navigate" data-page="focus">Open focus list ${icon('arrow')}</button></div>`;}
function rhythmCard(){const now=dayDate(today()),days=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(d.getDate()-6+i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;});const count=d=>store.activity.filter(a=>a.date===d&&a.kind==='topic').length;const done=count(today()),goal=store.profile.dailyGoal;return `<div class="card rhythm-card"><div class="rhythm-title"><h3>A little, every day</h3>${icon('calendar')}</div><div class="week-row">${days.map((d,i)=>{const n=count(d);return `<div class="week-day ${i===6?'today':''}" title="${e(dateText(d))}: ${plural(n,'topic check-off')}">${dayDate(d).toLocaleDateString('en',{weekday:'narrow'})}<div class="week-dot ${n>=goal?'did-goal':n?'did-some':''}">${n>=goal?icon('check'):n?'·':''}</div></div>`;}).join('')}</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,done/goal*100)}%"></div></div><p class="rhythm-caption"><b>${done} / ${goal}</b> topic check-offs today <span style="float:right">${done>=goal?'Nice work!':'Small steps count.'}</span></p></div>`;}
function subjectsPage(){const ss=filteredSubjects();return `<section class="page all-subjects"><div class="page-heading"><div><div class="eyebrow">YOUR CHAPTERS, ALL TOGETHER</div><h1>My subjects</h1><p class="subheading">Open a subject. Rate your confidence. Check off what you’ve covered.</p></div><button class="button secondary" data-action="help" style="margin-top:18px">${icon('help')} Quick guide</button></div><div class="browse-toolbar">${categoryTabs()}<div class="input-wrap browse-search">${icon('search')}<input id="subject-search" type="search" placeholder="Find a subject…" aria-label="Find a subject" value="${e(UI.subjectQuery)}" autocomplete="off"></div></div>${ss.length?['Science','Languages','Other'].filter(g=>ss.some(s=>s.group===g)).map(g=>`<div class="group-label">${g==='Other'?'General subjects':g==='Science'?'Science & mathematics':'Language papers'} <span style="color:var(--line);margin:0 6px">/</span> ${ss.filter(s=>s.group===g).length}</div><div class="subjects-grid">${ss.filter(s=>s.group===g).map(subjectCard).join('')}</div>`).join(''):empty('search','No subjects found','Try a subject name in English or Bangla.')} ${outlineNote()}${footer()}</section>`;}
function subjectPage(sid){const s=getSubject(sid),a=stats(sid),cs=chaptersFor(sid),hidden=chaptersFor(sid,true).filter(c=>store.excluded.includes(c.id));const q=UI.chapterQuery.toLocaleLowerCase().trim();const visible=cs.filter(c=>{const p=progress(c.id),b=band(p.rating);return (UI.chapterStatus==='all'||UI.chapterStatus===b||(UI.chapterStatus==='pinned'&&p.pinned))&&(!q||`${c.title} ${c.bn} ${topicsFor(c).map(t=>t.title).join(' ')}`.toLocaleLowerCase().includes(q));});let lastSection='';return `<section class="page"><button class="breadcrumb-link" data-action="navigate" data-page="subjects">${icon('back')} My subjects</button><div class="subject-heading"><span class="pill-icon large ${s.color}">${icon(s.icon)}</span><div><h1>${e(s.name)}</h1><p class="bn" lang="bn">${e(s.bn)}</p></div><div class="subject-heading-actions"><button class="button secondary" data-action="add-chapter" data-sid="${s.id}">${icon('plus')} Add chapter</button></div></div><div class="card subject-overview"><div><div class="label">Subject confidence</div><div class="number">${a.avg===null?'—':fmt(a.avg)}<small>/ 10</small></div>${stars(a.avg)}<div class="description">Average of ${a.rated} rated chapters</div></div><div><div class="label">Topics covered</div><div class="number">${a.pct}<small>%</small></div><div class="progress-track"><div class="progress-fill" style="width:${a.pct}%;background:${COLORS[s.color]}"></div></div><div class="description">${a.done} of ${a.total} topics checked</div></div><div><div class="label">Your baseline</div><div class="number">${a.rated}<small>/ ${a.chapters} chapters</small></div><div class="description">${a.unrated?`${a.unrated} still to assess`:'Every chapter has a rating. Nice work.'}</div><div class="description" style="margin-top:9px">${a.weak} need work <span style="margin:0 8px">·</span> ${a.strong} strong</div></div></div><div class="chapter-workspace"><section><div class="chapter-toolbar"><div class="input-wrap">${icon('search')}<input id="chapter-search" type="search" placeholder="Find a chapter or topic…" aria-label="Find a chapter or topic" value="${e(UI.chapterQuery)}" autocomplete="off"></div><select id="chapter-status" aria-label="Filter chapters by confidence">${[['all','All chapters'],['unknown','Not assessed'],['weak','Needs work · 0–4'],['building','Building · 5–7'],['strong','Strong · 8–10'],['pinned','Pinned for revision']].map(([v,l])=>`<option value="${v}" ${UI.chapterStatus===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="chapters-count">${visible.length} of ${cs.length} chapter / skill sections <span style="float:right">Tap a chapter to open</span></div><div class="chapters">${visible.length?visible.map(c=>{let heading='';if(c.section!==lastSection){lastSection=c.section;heading=`<div class="chapter-section">${e(c.section)}</div>`;}return heading+chapterCard(c,cs.indexOf(c)+1);}).join(''):empty('search','Nothing in this view','Try another filter or search for a different topic.')} </div>${hidden.length?`<div class="excluded-row">${icon('eyeOff')} ${hidden.length} excluded from your syllabus. <button data-action="toggle-excluded">${UI.showExcluded?'Hide':'Manage'}</button></div>${UI.showExcluded?hidden.map(c=>`<div class="excluded-card"><div><p>${e(c.title)}</p><small class="muted">Progress kept, excluded from totals</small></div><button class="button secondary small" data-action="restore-chapter" data-cid="${c.id}">${icon('restore')} Restore</button></div>`).join(''):''}`:''}<div class="source-note">Starter outline reference ${sourceLink(s.source)} · Your textbook and latest school / board syllabus take priority. Practical and writing sections are study-planning sections, not extra textbook chapters.</div></section><aside class="chapter-aside"><div class="side-stack">${subjectInsights(a)}${confidenceGuide()}<div class="gentle-note">${icon('info')}<strong>Covered ≠ confident.</strong>Check a topic after studying it. Update your stars after testing yourself. Both tell a different part of the story.</div></div></aside></div>${footer()}</section>`;}

function chapterVideoUrl(c){
  const direct=(c.topics||[]).find(t=>t.video);
  if(direct)return direct.video;
  const s=c.subject||getSubject(c.id?c.id.split('-')[0]:'')||{};
  const subject=s.bn||s.name||'';
  const chapter=[c.bn,c.title].filter(Boolean).join(' ');
  const q=`SSC Bangladesh NCTB class 9 10 ${subject} ${chapter} full chapter lesson`.replace(/\s+/g,' ').trim();
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}&sp=EgIQAQ%3D%3D`;
}
function topicVideoUrl(c,t){
  if(t.video)return t.video;
  const s=c.subject||getSubject(c.id?c.id.split('-')[0]:'')||{};
  const subject=s.bn||s.name||'';
  const chapter=[c.bn,c.title].filter(Boolean).join(' ');
  const topic=t.title||'';
  const q=`SSC Bangladesh NCTB class 9 10 ${subject} ${chapter} ${topic} lesson`.replace(/\s+/g,' ').trim();
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}&sp=EgIQAQ%3D%3D`;
}

function chapterCard(c,index){const p=progress(c.id),a=chapterStats(c),open=UI.openChapter===c.id,ts=topicsFor(c);return `<article class="card chapter-card ${open?'open':''}" id="chapter-${c.id}"><button id="chapter-toggle-${c.id}" class="chapter-row" data-action="toggle-chapter" data-cid="${c.id}" aria-expanded="${open}" aria-controls="chapter-body-${c.id}"><span class="chapter-number">${c.section==='Practical'?icon('flask'):String(index).padStart(2,'0')}</span><span class="chapter-title"><h3>${e(c.title)} ${p.pinned?`<span style="color:var(--accent)">${icon('pin')}</span>`:''}</h3><span class="bn" lang="bn">${e(c.bn)}</span></span><span class="chapter-mini-stats"><span class="mini-rating">${star()}${p.rating===null?'—':`<b>${p.rating}</b><span>/10</span>`}</span><span class="topics-mini">${a.done}/${a.total} topics</span></span>${icon('down','row-chevron')}</button><div class="chapter-body ${open?'':'hidden'}" id="chapter-body-${c.id}" ${open?'':'hidden'}><div class="confidence-heading">How confident do you feel?</div><div class="confidence-explanation">Can you explain the ideas and solve questions without help?</div><div class="rating-line"><div class="star-rating" role="radiogroup" aria-label="${e(c.title)} confidence out of ten" data-chapter="${c.id}"><label class="star-choice zero-choice ${p.rating===0?'filled':''}" title="0 out of 10 — not understood yet"><input id="rate-${c.id}-0" type="radio" name="rating-${c.id}" value="0" data-rating="${c.id}" ${p.rating===0?'checked':''} aria-label="0 out of 10 — not understood yet"><span aria-hidden="true">0</span></label>${Array.from({length:10},(_,i)=>{const v=i+1;return `<label class="star-choice ${p.rating!==null&&p.rating>=v?'filled':''}" data-star="${v}" title="${v} out of 10"><input id="rate-${c.id}-${v}" type="radio" name="rating-${c.id}" value="${v}" data-rating="${c.id}" ${p.rating===v?'checked':''} aria-label="${v} out of 10">${star()}</label>`;}).join('')}</div><span class="rating-number">${p.rating===null?'—':p.rating}<small>/ 10</small></span></div><div class="rating-footer">${badge(p.rating)}${p.rating!==null?`<button class="text-button" data-action="clear-rating" data-cid="${c.id}">Clear rating</button>`:'<span class="tiny muted">Unrated isn’t the same as 0.</span>'}</div><div class="topic-head"><div><h4>Topic checklist · টপিক তালিকা</h4><div class="topic-video-hint">প্রশ্নের ধরন বিষয়বস্তুর ভিত্তিতে প্রস্তাবিত—প্রয়োজনে বদলে নিন · Science/Math/ICT-তে সরাসরি ভিডিও লিংক</div></div><div class="topic-head-actions"><span class="topic-count">${a.done} of ${a.total} covered · ${a.pct}%</span><a class="chapter-video-link" href="${chapterVideoUrl(c)}" target="_blank" rel="noopener noreferrer" title="${(c.topics||[]).some(t=>t.video)?'অধ্যায়ের সরাসরি ভিডিও দেখুন':'এই অধ্যায়ের জন্য YouTube-এ ভিডিও খুঁজুন'}" aria-label="${(c.topics||[]).some(t=>t.video)?'Watch a video for this chapter':'Find a YouTube video for this chapter'}">${icon('youtube')} <span>${(c.topics||[]).some(t=>t.video)?'ভিডিও দেখুন':'ভিডিও খুঁজুন'}</span></a></div></div><div class="progress-track"><div class="progress-fill" style="width:${a.pct}%"></div></div><div class="topic-list">${ts.map(t=>`<div class="topic-item ${p.done.includes(t.id)?'is-done':''} ${t.id.startsWith('custom-')?'custom':''}"><input id="topic-${t.id}" type="checkbox" data-topic="${t.id}" data-cid="${c.id}" aria-label="Mark ${e(t.title)} complete" ${p.done.includes(t.id)?'checked':''}><span class="topic-text">${e(t.title)}</span><select class="topic-exam-type ${(store.topicExamTypes[t.id]||t.examType||'unset')}" id="exam-type-${t.id}" data-exam-type="${t.id}" aria-label="Question type for ${e(t.title)}" title="Suggested type — change if needed"><option value="" ${!(store.topicExamTypes[t.id]||t.examType)?'selected':''}>Type</option><option value="mcq" ${(store.topicExamTypes[t.id]||t.examType)==='mcq'?'selected':''}>MCQ</option><option value="cq" ${(store.topicExamTypes[t.id]||t.examType)==='cq'?'selected':''}>CQ</option><option value="both" ${(store.topicExamTypes[t.id]||t.examType)==='both'?'selected':''}>MCQ + CQ</option></select><a class="topic-video-btn" href="${topicVideoUrl(c,t)}" target="_blank" rel="noopener noreferrer" title="এই টপিকের সরাসরি YouTube ভিডিও দেখুন" aria-label="Watch the YouTube video for ${e(t.title)}" onclick="event.stopPropagation()">${icon('youtube')}<span class="video-label">দেখুন</span></a></div>`).join('')}</div><button class="add-topic" data-action="add-topic" data-cid="${c.id}">${icon('plus')} Add your own topic</button><label class="notes-label" for="notes-${c.id}">${icon('edit')} A note to your future self</label><textarea id="notes-${c.id}" class="chapter-notes" data-notes="${c.id}" placeholder="A formula I forget, a question to ask, a mistake to revisit…" maxlength="10000">${e(p.notes)}</textarea><div class="chapter-actions"><button class="button secondary ${p.pinned?'pinned':''}" data-action="pin" data-cid="${c.id}" aria-pressed="${p.pinned}">${icon('pin')} ${p.pinned?'Pinned for revision':'Pin for revision'}</button><button class="button secondary" data-action="review" data-cid="${c.id}" ${p.reviewedAt===today()?'disabled':''}>${icon(p.reviewedAt===today()?'check':'history')} ${p.reviewedAt===today()?'Reviewed today':'Mark reviewed'}</button><button class="icon-button" data-action="edit-chapter" data-cid="${c.id}" title="Edit chapter and topics" aria-label="Edit chapter and topic outline">${icon('edit')}</button><button class="button ghost exclude" data-action="exclude-chapter" data-cid="${c.id}" title="Exclude this chapter from your syllabus">${icon('eyeOff')}<span class="exclude-text">Exclude</span></button></div><div class="review-info">${p.reviewedAt?`Last reviewed ${e(dateText(p.reviewedAt))}. ${isDue(c)?'Ready for another look.':`Next review ${e(dateText(addDays(p.reviewedAt,7)))}.`}`:'Mark a revision session as reviewed to get a gentle reminder after 7 days.'}</div></div></article>`;}
function addDays(s,n){const d=dayDate(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function subjectInsights(a){return `<div class="card insight-card"><h3>Your chapter picture</h3><div class="subject-mini-chart">${[['strong',a.strong],['building',a.building],['weak',a.weak]].filter(x=>x[1]).map(([b,n])=>`<span style="width:${n/Math.max(a.chapters,1)*100}%;background:${chartColor(b)}"></span>`).join('')}</div><div class="legend-list">${[['strong','Strong · 8–10',a.strong],['building','Building · 5–7',a.building],['weak','Needs work · 0–4',a.weak],['unknown','Not assessed',a.unrated]].map(([b,l,n])=>`<div class="legend-item"><span class="legend-square" style="background:${chartColor(b)}"></span>${l}<b>${n}</b></div>`).join('')}</div></div>`;}
function confidenceGuide(){return `<div class="card confidence-guide"><h3>A simple star guide</h3><div class="guide-line"><span class="guide-score">0–4</span><p>I need notes or help to get through this.</p></div><div class="guide-line"><span class="guide-score">5–7</span><p>I know the basics. More practice will help.</p></div><div class="guide-line" style="margin-bottom:0"><span class="guide-score">8–10</span><p>I can explain it and solve questions on my own.</p></div></div>`;}
function analyticsPage(){const a=stats(),list=recommendations().filter(c=>progress(c.id).rating!==null&&progress(c.id).rating<8).slice(0,6);return `<section class="page"><div class="page-heading"><div><div class="eyebrow">THE BIGGER PICTURE</div><h1>Know where to focus</h1><p class="subheading">Your confidence and your coverage, side by side.</p></div><button class="button secondary" data-action="csv" style="margin-top:18px">${icon('download')} Export report</button></div>${statCards()}<div class="analytics-top"><div class="card comparison-card"><div class="card-head"><div><h2>Subject confidence</h2><p>Average of rated chapters · out of 10</p></div>${icon('chart')}</div><div class="chart-scale"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div><div class="comparison-rows">${DATA.map(s=>{const st=stats(s.id);return `<button class="comparison-row" data-action="subject" data-sid="${s.id}" title="${e(s.name)}: ${st.avg===null?'not assessed':fmt(st.avg)+' /10'}; ${st.rated} of ${st.chapters} chapters rated"><span class="comparison-name"><span class="subject-dot" style="background:${COLORS[s.color]}"></span>${e(s.id==='bgs'?'Bangladesh & Global':s.id==='islam'?'Islam & Moral Ed.':s.name)}</span><span class="comparison-track"><span class="comparison-fill" style="display:block;width:${st.avg===null?0:st.avg*10}%;background:${chartColor(band(st.avg))}"></span></span><span class="comparison-score ${st.avg===null?'empty':''}">${st.avg===null?'—':fmt(st.avg)}</span></button>`;}).join('')}</div><div class="comparison-footnote">An unrated subject is unknown, not weak. Hover or tap a subject to explore its chapters.</div></div><div class="card distribution-card"><div class="card-head"><h2>Your chapter balance</h2>${icon('target')}</div><p class="subheading">All ${a.chapters} active chapter / skill sections</p>${donut(a)}<div class="legend-list">${[['strong','Strong · 8–10',a.strong],['building','Building · 5–7',a.building],['weak','Needs work · 0–4',a.weak],['unknown','Not assessed',a.unrated]].map(([b,l,n])=>`<div class="legend-item"><span class="legend-square" style="background:${chartColor(b)}"></span>${l}<b>${n}<span style="font-weight:400;color:var(--subtle);font-size:9px;margin-left:6px">${a.chapters?Math.round(n/a.chapters*100):0}%</span></b></div>`).join('')}</div><div class="comparison-footnote">${a.unrated?`${a.unrated} chapters are still unassessed. Rating them gives you a more reliable picture.`:'Your baseline is complete. Update your ratings as your understanding improves.'}</div></div></div><div class="card heatmap-card"><div class="card-head"><h2>The chapter map</h2><div class="heatmap-legend">${[['weak','0–4'],['building','5–7'],['strong','8–10'],['unknown','Not assessed']].map(([b,l])=>`<span><i style="background:${chartColor(b)}"></i>${l}</span>`).join('')}</div></div><p class="heatmap-subtitle">One square, one chapter. Click a square to jump straight in.</p><div class="heatmap-scroll">${DATA.map(s=>`<div class="heatmap-row"><span class="heatmap-label">${e(s.id==='bgs'?'Bangladesh & Global':s.id==='islam'?'Islam & Moral Ed.':s.name)}</span><div class="heatmap-squares">${chaptersFor(s.id).map((c,i)=>{const p=progress(c.id),st=chapterStats(c);const text=`${s.name}, ${c.title}: ${p.rating===null?'not assessed':p.rating+' /10'}, ${st.done}/${st.total} topics covered`;return `<button class="heat-square ${band(p.rating)}" data-action="open-chapter" data-cid="${c.id}" title="${e(text)}" aria-label="${e(text)}"></button>`;}).join('')}</div></div>`).join('')}</div></div><div class="card focus-table-card"><div class="card-head"><div><h2>A little extra attention</h2><p>Your lowest-rated chapters, with coverage for context.</p></div><button class="text-button" data-action="navigate" data-page="focus">View focus list ${icon('arrow')}</button></div>${list.length?focusTable(list):empty('sprout',a.rated?'No low-confidence chapters right now':'Your weak spots will appear here',a.rated?'Keep rating unassessed chapters, or use your focus list for pinned and due revisions.':'Rate a few chapters honestly. We’ll find the ones that could benefit most from your next study session.',`<button class="button secondary" data-action="navigate" data-page="subjects">${a.rated?'Keep tracking':'Rate my chapters'} ${icon('arrow')}</button>`)}</div><p class="analytics-note">How this works: confidence is the mean of your rated, active chapters. Coverage is checked topics ÷ active topics. “Needs work” means 0–4 stars; “strong” means 8–10. Unrated and excluded chapters never lower your average. These are self-assessments, not predicted marks or GPA.</p>${footer()}</section>`;}
function donut(a){let offset=0;const parts=[['strong',a.strong],['building',a.building],['weak',a.weak]];const circles=parts.map(([b,n])=>{const len=a.chapters?n/a.chapters*100:0;const v=`<circle cx="100" cy="100" r="76" fill="none" stroke="${chartColor(b)}" stroke-width="13" pathLength="100" stroke-dasharray="${Math.max(0,len)} ${100-len}" stroke-dashoffset="${-offset}"/>`;offset+=len;return n?v:'';}).join('');return `<div class="donut-wrap" role="img" aria-label="${a.rated} of ${a.chapters} chapters assessed; ${a.strong} strong, ${a.building} building, ${a.weak} need work"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="76" fill="none" stroke="var(--unknown)" stroke-width="13"/>${circles}</svg><div class="donut-center"><strong>${a.rated}</strong><span>of ${a.chapters} assessed</span></div></div>`;}
function focusTable(list){return `<div class="table-scroll"><table class="focus-table"><thead><tr><th>Chapter</th><th>Confidence</th><th class="hide-mobile">Topics covered</th><th class="hide-mobile">Last reviewed</th><th><span class="sr-only">Open</span></th></tr></thead><tbody>${list.map(c=>{const p=progress(c.id),a=chapterStats(c);return `<tr><td><span class="table-chapter">${e(c.title)}</span><span class="table-subject">${e(c.subject.name)}</span></td><td>${badge(p.rating)}<div style="font-size:9px;color:var(--subtle);margin-top:4px">${p.rating}/10 stars</div></td><td class="hide-mobile"><span class="topic-percent">${a.pct}%</span><div style="font-size:9px;color:var(--subtle);margin-top:3px">${a.done}/${a.total} topics</div></td><td class="hide-mobile review-date">${p.reviewedAt?e(dateText(p.reviewedAt)):'Not yet'}</td><td><button class="button secondary small" data-action="open-chapter" data-cid="${c.id}" aria-label="Review ${e(c.title)}">Review ${icon('arrow')}</button></td></tr>`;}).join('')}</tbody></table></div>`;}
function focusPage(){const all=allChapters(),counts={recommended:recommendations().length,weak:all.filter(c=>band(progress(c.id).rating)==='weak').length,building:all.filter(c=>band(progress(c.id).rating)==='building').length,pinned:all.filter(c=>progress(c.id).pinned).length,due:all.filter(isDue).length,unknown:all.filter(c=>progress(c.id).rating===null).length};let list=UI.focusFilter==='recommended'?recommendations():all.filter(c=>UI.focusFilter==='pinned'?progress(c.id).pinned:UI.focusFilter==='due'?isDue(c):band(progress(c.id).rating)===UI.focusFilter).sort((a,b)=>(progress(a.id).rating??11)-(progress(b.id).rating??11));if(UI.focusSubject!=='all')list=list.filter(c=>c.subject.id===UI.focusSubject);const visible=list.slice(0,UI.focusLimit);return `<section class="page"><div class="page-heading"><div><div class="eyebrow">LESS GUESSING, MORE DIRECTION</div><h1>My focus list</h1><p class="subheading">Not everything needs your attention at once.</p></div>${datePill()}</div><div class="focus-intro">${icon('target')}<span>Start small: pick one chapter, revisit an unchecked topic, then test yourself and update your stars.</span></div><div class="focus-filters" role="group" aria-label="Focus list filter">${[['recommended','Recommended'],['weak','Needs work'],['building','Building'],['pinned','Pinned'],['due','Review due'],['unknown','Not assessed']].map(([v,l])=>`<button id="focus-filter-${v}" class="filter-tab ${UI.focusFilter===v?'active':''}" data-action="focus-filter" data-value="${v}" aria-pressed="${UI.focusFilter===v}">${l}<span class="count">${counts[v]}</span></button>`).join('')}</div><div class="focus-controls"><span>${plural(list.length,'chapter')}${UI.focusFilter==='unknown'?' to get to know':' in this view'}</span><select id="focus-subject" aria-label="Filter focus list by subject"><option value="all">All subjects</option>${DATA.map(s=>`<option value="${s.id}" ${UI.focusSubject===s.id?'selected':''}>${e(s.name)}</option>`).join('')}</select></div><div class="focus-list">${visible.length?visible.map(revisionCard).join(''):`<div class="card">${empty(UI.focusFilter==='due'?'history':'sprout',counts.recommended===0&&UI.focusFilter==='recommended'?'Your focus list is a clean slate':'Nothing here for now',UI.focusFilter==='due'?'Mark a chapter as reviewed after a revision session. It will appear here 7 days later.':UI.focusFilter==='pinned'?'Pin any chapter to keep it here, regardless of its star rating.':UI.focusFilter==='recommended'?'Chapters rated below 8, pinned chapters and due reviews will appear here. Start with a few honest ratings.':'Try another filter or assess more chapters to build a clearer picture.',`<button class="button secondary" data-action="navigate" data-page="subjects">Explore my subjects ${icon('arrow')}</button>`)}</div>`}</div>${list.length>visible.length?`<button class="button secondary view-more" data-action="more-focus">Show ${Math.min(30,list.length-visible.length)} more chapters ${icon('down')}</button>`:''}<p class="focus-end-note">${UI.focusFilter==='unknown'?'Not assessed means unknown. It does not mean weak.':'Recommendations use your confidence ratings, pins and a simple 7-day review reminder.'}</p>${footer()}</section>`;}
function revisionCard(c){const p=progress(c.id),a=chapterStats(c);return `<article class="card revision-card"><span class="pill-icon ${c.subject.color}">${icon(c.subject.icon)}</span><div class="revision-body"><div class="revision-subject">${e(c.subject.name)} · ${e(c.section)}</div><h3>${e(c.title)}</h3><div class="revision-meta">${badge(p.rating)}<span>${a.done}/${a.total} topics</span>${isDue(c)?'<span style="color:var(--building)">Review due</span>':p.reviewedAt?`<span>Reviewed ${e(dateText(p.reviewedAt))}</span>`:''}${p.pinned?'<span>Pinned</span>':''}</div></div><div class="revision-score">${p.rating===null?'—':p.rating}<small>/10</small></div><div class="revision-buttons"><button class="icon-button" data-action="pin" data-cid="${c.id}" title="${p.pinned?'Unpin':'Pin for revision'}" aria-label="${p.pinned?'Unpin':'Pin'} ${e(c.title)}" aria-pressed="${p.pinned}" style="${p.pinned?'color:var(--accent)':''}">${icon('pin')}</button><button class="button secondary review-toggle" data-action="review" data-cid="${c.id}" ${p.reviewedAt===today()?'disabled':''}>${icon(p.reviewedAt===today()?'check':'history')} ${p.reviewedAt===today()?'Reviewed':'Mark reviewed'}</button><button class="button" data-action="open-chapter" data-cid="${c.id}">Open ${icon('arrow')}</button></div></article>`;}

function cloudConfigured(){const c=window.ORBIT_CLOUD_CONFIG||{};return typeof c.supabaseUrl==='string'&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(c.supabaseUrl)&&typeof c.supabaseAnonKey==='string'&&c.supabaseAnonKey.length>20&&!c.supabaseAnonKey.includes('YOUR-');}

  return `<label class="field" for="cloud-email">Email for private sync</label><div class="cloud-signin-row"><input id="cloud-email" type="email" autocomplete="email" placeholder="you@example.com" required><button type="button" class="button" data-action="cloud-signin">Email me a sign-in link</button></div><p class="cloud-message" id="cloud-message">${e(cloudMessage||'Sign in with the same email on your PC and phone to sync progress.')}</p>`;
}
function refreshCloudPanel(){const el=document.getElementById('cloud-sync-content');if(el)el.innerHTML=cloudPanelHtml();updateStatus();}
function cloudRedirectUrl(){return window.location.href.split('#')[0].split('?')[0];}
async function cloudSignIn(){if(!cloudClient){toast('Cloud sync is not configured yet.','info');return;}const email=document.getElementById('cloud-email')?.value.trim();if(!email){toast('Enter your email first.','info');return;}cloudMessage='Sending your secure sign-in link…';refreshCloudPanel();const {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:cloudRedirectUrl(),shouldCreateUser:true}});if(error){cloudMessage='Sign-in email could not be sent: '+error.message;toast('Could not send sign-in email. Check the setup.','info');}else{cloudMessage='Check your inbox and open the sign-in link on this device.';toast('Sign-in link sent. Check your email.','spark');}refreshCloudPanel();}
async function cloudSignOut(){if(!cloudClient)return;const {error}=await cloudClient.auth.signOut();if(error){cloudMessage='Sign-out failed: '+error.message;}else{cloudUser=null;cloudNeedsUpload=false;cloudMessage='Signed out. This browser’s local progress is still here.';}refreshCloudPanel();}
async function cloudWriteSnapshot(){if(!cloudClient||!cloudUser)return false;const row={user_id:cloudUser.id,data:store,updated_at:new Date().toISOString()};const {error}=await cloudClient.from('orbit_study_progress').upsert(row,{onConflict:'user_id'});if(error)throw error;store.updatedAt=row.updated_at;try{localStorage.setItem(KEY,JSON.stringify(store));localStorage.setItem(CLOUD_OWNER_KEY,cloudUser.id);}catch{}cloudNeedsUpload=false;return true;}
async function syncCloud(forceLocal=false){
  if(!cloudClient||!cloudUser||cloudBusy)return;
  cloudBusy=true;cloudPending=true;cloudMessage='Syncing…';refreshCloudPanel();
  try{
    const {data:remote,error}=await cloudClient.from('orbit_study_progress').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();
    if(error)throw error;
    const owner=localStorage.getItem(CLOUD_OWNER_KEY)||'';
    if(forceLocal){await cloudWriteSnapshot();cloudMessage='This browser’s progress is now synced to your account.';}
    else if(remote){
      const localTime=Date.parse(store.updatedAt||'1970-01-01T00:00:00Z')||0;
      const remoteTime=Date.parse(remote.updated_at||remote.data?.updatedAt||'1970-01-01T00:00:00Z')||0;
      if(owner!==cloudUser.id||remoteTime>localTime){
        store=sanitize(remote.data);if(!store.updatedAt)store.updatedAt=remote.updated_at||null;
        localStorage.setItem(KEY,JSON.stringify(store));localStorage.setItem(CLOUD_OWNER_KEY,cloudUser.id);render(true);
        cloudMessage='Latest progress loaded from your cloud account.';
      }else{await cloudWriteSnapshot();cloudMessage='Your latest progress is synced.';}
      cloudNeedsUpload=false;
    }else if(owner===cloudUser.id){await cloudWriteSnapshot();cloudMessage='Your progress backup was restored to the cloud.';}
    else{cloudNeedsUpload=true;cloudMessage='No cloud backup exists yet. Upload this browser’s progress to start syncing it.';}
  }catch(err){cloudMessage='Sync failed: '+(err?.message||'check your connection and Supabase setup');toast('Cloud sync failed. Your local progress is safe.','info');}
  finally{cloudBusy=false;cloudPending=false;refreshCloudPanel();}
}
function scheduleCloudSync(){if(!cloudClient||!cloudUser||demo)return;let owner='';try{owner=localStorage.getItem(CLOUD_OWNER_KEY)||'';}catch{}if(owner!==cloudUser.id)return;clearTimeout(cloudTimer);cloudPending=true;cloudTimer=setTimeout(()=>syncCloud(false),900);updateStatus();}
function initCloud(){
  if(!cloudConfigured()||!window.supabase?.createClient){refreshCloudPanel();return;}
  try{const cfg=window.ORBIT_CLOUD_CONFIG;cloudClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    cloudClient.auth.onAuthStateChange((event,session)=>{cloudUser=session?.user||null;if(event==='SIGNED_OUT')cloudNeedsUpload=false;refreshCloudPanel();if(cloudUser&&['SIGNED_IN','INITIAL_SESSION','TOKEN_REFRESHED'].includes(event))setTimeout(()=>syncCloud(false),40);});
    cloudClient.auth.getSession().then(({data,error})=>{if(error)throw error;cloudUser=data.session?.user||null;refreshCloudPanel();if(cloudUser)setTimeout(()=>syncCloud(false),60);}).catch(err=>{cloudMessage='Could not check your sign-in: '+err.message;refreshCloudPanel();});
  }catch(err){cloudClient=null;cloudMessage='Cloud initialization failed: '+err.message;refreshCloudPanel();}
}

function searchResults(q){const el=document.getElementById('search-results');q=q.toLocaleLowerCase().trim();if(!q){el.innerHTML='<div class="search-hint">Try a subject, chapter or topic in English or Bangla.</div>';return;}const results=allChapters().map(c=>{const chapterMatch=`${c.title} ${c.bn}`.toLocaleLowerCase().includes(q),subjectMatch=`${c.subject.name} ${c.subject.bn}`.toLocaleLowerCase().includes(q),topic=topicsFor(c).find(t=>t.title.toLocaleLowerCase().includes(q));return chapterMatch||subjectMatch||topic?{c,topic,rank:chapterMatch?0:topic?1:2}:null;}).filter(Boolean).sort((a,b)=>a.rank-b.rank).slice(0,25);el.innerHTML=results.length?results.map(({c,topic})=>`<button class="search-result" data-action="search-open" data-cid="${c.id}"><span class="pill-icon ${c.subject.color}">${icon(c.subject.icon)}</span><span><span class="search-result-title">${e(c.title)}</span><span class="search-result-meta">${e(c.subject.name)}${topic?' · '+e(topic.title):' · '+e(c.bn)}</span></span>${icon('arrow','muted')}</button>`).join(''):'<div class="search-hint">No matching chapters or topics.<br>Try a shorter word, or add a custom topic.</div>';}
/* Local persistence and backups */
function cleanText(x,max=500){return typeof x==='string'?x.trim().slice(0,max):'';}
function safeId(x){return typeof x==='string'&&/^custom-[a-zA-Z0-9-]{4,90}$/.test(x);}
function sanitize(raw){if(!raw||typeof raw!=='object'||raw.version!==1||!raw.chapters||typeof raw.chapters!=='object')throw new Error('This is not an Orbit SSC backup.');const out=freshState(),p=raw.profile||{};out.profile.name=cleanText(p.name,40);out.profile.theme=['light','dark','system'].includes(p.theme)?p.theme:'light';out.profile.dailyGoal=Number.isInteger(+p.dailyGoal)?Math.max(1,Math.min(30,+p.dailyGoal)):3;out.profile.targetDate=typeof p.targetDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.targetDate)&&!isNaN(dayDate(p.targetDate))?p.targetDate:'';const known=new Map(DATA.flatMap(s=>s.chapters.map(c=>[c.id,c]))),topicIDs=new Set(DATA.flatMap(s=>s.chapters.flatMap(c=>c.topics.map(t=>t.id))));let totalCustom=0;
  for(const s of DATA){const list=raw.customChapters?.[s.id];if(!Array.isArray(list))continue;out.customChapters[s.id]=[];for(const c of list.slice(0,100)){if(!c||!safeId(c.id)||known.has(c.id)||!cleanText(c.title,250))continue;const ts=[];for(const t of (Array.isArray(c.topics)?c.topics:[]).slice(0,100)){if(!t||!safeId(t.id)||topicIDs.has(t.id)||!cleanText(t.title))continue;ts.push({id:t.id,title:cleanText(t.title)});topicIDs.add(t.id);}if(!ts.length)continue;const valid={id:c.id,title:cleanText(c.title,250),bn:cleanText(c.bn,250),section:'Custom chapters',topics:ts};out.customChapters[s.id].push(valid);known.set(c.id,valid);totalCustom++;if(totalCustom>500)throw new Error('This backup has too many custom chapters.');}}
  for(const [cid,c] of known){const list=raw.customTopics?.[cid];if(Array.isArray(list)){const ts=[];for(const t of list.slice(0,100)){if(!t||!safeId(t.id)||topicIDs.has(t.id)||!cleanText(t.title))continue;ts.push({id:t.id,title:cleanText(t.title)});topicIDs.add(t.id);}if(ts.length)out.customTopics[cid]=ts;}const edit=raw.chapterEdits?.[cid];if(edit&&typeof edit==='object'&&cleanText(edit.title,250))out.chapterEdits[cid]={title:cleanText(edit.title,250),bn:cleanText(edit.bn,250)};}
  for(const tid of topicIDs){if(typeof raw.topicEdits?.[tid]==='string'&&cleanText(raw.topicEdits[tid]))out.topicEdits[tid]=cleanText(raw.topicEdits[tid]);const kind=raw.topicExamTypes?.[tid];if(['mcq','cq','both'].includes(kind))out.topicExamTypes[tid]=kind;}
  out.hiddenTopics=Array.isArray(raw.hiddenTopics)?[...new Set(raw.hiddenTopics.filter(t=>topicIDs.has(t)))]:[];out.excluded=Array.isArray(raw.excluded)?[...new Set(raw.excluded.filter(c=>known.has(c)))]:[];
  for(const [cid,c] of known){const p=raw.chapters[cid];if(!p||typeof p!=='object')continue;const allowed=new Set([...c.topics,...(out.customTopics[cid]||[])].map(t=>t.id));out.chapters[cid]={rating:Number.isInteger(p.rating)&&p.rating>=0&&p.rating<=10?p.rating:null,done:Array.isArray(p.done)?[...new Set(p.done.filter(t=>allowed.has(t)))]:[],notes:typeof p.notes==='string'?p.notes.slice(0,10000):'',pinned:p.pinned===true,reviewedAt:typeof p.reviewedAt==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.reviewedAt)&&!isNaN(dayDate(p.reviewedAt))?p.reviewedAt:null};}
  out.activity=Array.isArray(raw.activity)?raw.activity.slice(-6000).filter(a=>a&&typeof a.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(a.date)&&['topic','rating','review'].includes(a.kind)&&known.has(a.chapter)).map(a=>({key:cleanText(a.key,250),date:a.date,kind:a.kind,chapter:a.chapter,topic:typeof a.topic==='string'&&topicIDs.has(a.topic)?a.topic:''})):[];out.updatedAt=typeof raw.updatedAt==='string'?raw.updatedAt:null;return out;
}
function load(){try{const check=KEY+'-test';localStorage.setItem(check,'1');localStorage.removeItem(check);const raw=localStorage.getItem(KEY);if(raw){try{store=sanitize(JSON.parse(raw));}catch(err){localStorage.setItem(KEY+'-recovery',raw);store=freshState();storageMessage='A saved file could not be read. A recovery copy was kept in browser storage. Restore a recent backup before tracking again.';storageAvailable=false;}}}catch(err){storageAvailable=false;storageMessage='This preview may not allow browser storage. Open the downloaded HTML in your browser for local saving, or export your progress before closing.';}}
function downloadFile(content,filename,type){const b=new Blob([content],{type}),a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function exportBackup(){if(demo){toast('Exit demo to export your real progress.','info');return;}const payload={...store,app:'Orbit SSC 2027',exportedAt:new Date().toISOString()};downloadFile(JSON.stringify(payload,null,2),`orbit-ssc-2027-backup-${today()}.json`,'application/json');toast('Backup prepared. Keep it somewhere safe.','download');}
function csvCell(x){let v=String(x??'');if(/^(\s*[=+\-@]|[\t\r])/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
function exportCSV(){if(demo){toast('Exit demo to export your real progress.','info');return;}const rows=[['Subject','Chapter / skill section','Confidence /10','Status','Covered topics','Total topics','Coverage %','Pinned','Last reviewed','Excluded','Notes']];for(const s of DATA)for(const c of chaptersFor(s.id,true)){const p=progress(c.id),a=chapterStats(c);rows.push([s.name,c.title,p.rating===null?'':p.rating,bandLabel[band(p.rating)],a.done,a.total,a.pct,p.pinned?'Yes':'No',p.reviewedAt||'',store.excluded.includes(c.id)?'Yes':'No',p.notes]);}downloadFile('\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),`orbit-study-report-${today()}.csv`,'text/csv;charset=utf-8');toast('Chapter report prepared.','download');}
async function importBackup(file){if(!file)return;if(demo){toast('Exit demo before importing a backup.','info');return;}if(file.size>5*1024*1024){toast('That file is too large. Choose an Orbit JSON backup.','info');return;}try{pendingImport=sanitize(JSON.parse(await file.text()));const a=Object.values(pendingImport.chapters),rated=a.filter(p=>p.rating!==null).length,checked=a.reduce((v,p)=>v+p.done.length,0);openDialog(`${dialogHead('Restore your progress','A quick check before replacing anything.')}<div class="dialog-body confirm-body"><div class="confirm-icon">${icon('upload')}</div><h3>Ready to import this backup?</h3><p>This replaces the progress and preferences currently saved in this browser. Export your current data first if you want to keep both.</p><div class="import-summary"><div><b>${rated}</b>rated chapters</div><div><b>${checked}</b>checked topics</div><div><b>${Object.values(pendingImport.customChapters).flat().length}</b>custom chapters</div></div></div><div class="dialog-footer"><button class="button ghost" data-action="close-dialog">Cancel</button><button class="button secondary" data-action="export">Back up current data</button><button class="button" data-action="restore-import">Replace & restore</button></div>`);}catch(err){pendingImport=null;toast('Couldn’t read that backup. Please choose a valid Orbit JSON file.','info');}finally{document.getElementById('import-file').value='';}}
function downloadApp(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#main').innerHTML='';clone.querySelector('#sidebar').innerHTML='';clone.querySelector('#dialog').innerHTML='';clone.querySelector('#dialog').removeAttribute('open');clone.querySelector('#dialog').setAttribute('aria-label','Study tracker dialog');clone.querySelector('#avatar').textContent='S';clone.querySelector('#sidebar').removeAttribute('inert');clone.querySelector('#toast').innerHTML='';clone.querySelector('#toast').className='toast';clone.querySelector('body').removeAttribute('style');clone.querySelector('#sidebar').classList.remove('is-open');clone.querySelector('#menu-backdrop').classList.remove('is-open');clone.querySelector('#storage-banner').innerHTML='';clone.querySelector('#storage-banner').classList.add('hidden');clone.querySelector('#demo-banner').innerHTML='';clone.querySelector('#demo-banner').classList.add('hidden');downloadFile('<!doctype html>\n'+clone.outerHTML,'ssc-2027-tracker.html','text/html;charset=utf-8');toast('Your offline HTML app is ready.','download');}
function startDemo(){if(!demo){realState=store;demo=true;}store=freshState();store.profile.name='A learner';let num=0;DATA.forEach((s,si)=>{const n=si<5?Math.min(s.chapters.length,8):Math.min(s.chapters.length,4);for(let i=0;i<n;i++){const c=s.chapters[i],p=progress(c.id,true);p.rating=[8,5,3,9,6,7,4,8,10,2,6,9][(i+si*2)%12];const amount=Math.round(c.topics.length*(p.rating/10)*.85);p.done=c.topics.slice(0,amount).map(t=>t.id);if(i===2&&si<3)p.pinned=true;if(i===0)p.reviewedAt=addDays(today(),-9);num++;}});for(let i=0;i<7;i++){const d=addDays(today(),-i),n=[2,4,1,3,0,5,3][i];for(let j=0;j<n;j++)store.activity.push({key:`${d}:topic:physics-1:demo-${i}-${j}`,date:d,kind:'topic',chapter:'physics-1',topic:''});}closeDialog();UI.category='All';UI.subjectQuery='';go('overview');toast('Exploring sample progress. Your own data is untouched.','spark');}
function exitDemo(){if(!demo)return;store=realState;realState=null;demo=false;closeDialog();UI.category='All';UI.subjectQuery='';go('overview');toast('Back to your own study space.');}
function closeMenu(){document.getElementById('sidebar').classList.remove('is-open');document.getElementById('sidebar').inert=innerWidth<=960;document.getElementById('menu-backdrop').classList.remove('is-open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');}
/* Events */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,cid=b.dataset.cid,sid=b.dataset.sid;switch(action){
  case 'navigate':go(b.dataset.page);break;
  case 'subject':go('subject',sid);break;
  case 'open-chapter':{const c=findChapter(cid);if(c)go('subject',c.subject.id,cid);break;}
  case 'category':UI.category=b.dataset.value;render(true);break;
  case 'toggle-chapter':UI.openChapter=UI.openChapter===cid?null:cid;render(true);break;
  case 'clear-rating':progress(cid,true).rating=null;commit();render(true);toast('Rating cleared. This chapter is unassessed.');break;
  case 'pin':{const p=progress(cid,true);p.pinned=!p.pinned;commit();render(true);toast(p.pinned?'Pinned to your focus list.':'Removed from your pinned list.');break;}
  case 'review':{progress(cid,true).reviewedAt=today();commit('review',cid);render(true);toast('Revision logged. We’ll remind you in 7 days.');break;}
  case 'add-chapter':addChapterDialog(sid);break;
  case 'add-topic':addTopicDialog(cid);break;
  case 'edit-chapter':editChapterDialog(cid);break;
  case 'exclude-chapter':confirmDialog('Exclude from your syllabus?',`<b>${e(findChapter(cid)?.title)}</b> will be hidden and left out of all analytics. Your ratings, topics and notes stay safe. You can restore it later from this subject’s excluded chapters.`,()=>{store.excluded.push(cid);UI.openChapter=null;commit();render(true);toast('Chapter excluded. Progress kept.');},'Exclude chapter');break;
  case 'restore-chapter':store.excluded=store.excluded.filter(x=>x!==cid);commit();render(true);toast('Chapter restored to your outline.');break;
  case 'toggle-excluded':UI.showExcluded=!UI.showExcluded;render(true);break;
  case 'focus-filter':UI.focusFilter=b.dataset.value;UI.focusLimit=30;render(true);break;
  case 'more-focus':UI.focusLimit+=30;render(true);break;
  case 'cloud-signin':cloudSignIn();break;
  case 'cloud-signout':cloudSignOut();break;
  case 'cloud-sync':syncCloud(false);break;
  case 'cloud-upload':syncCloud(true);break;
  case 'settings':closeMenu();settingsDialog();break;
  case 'help':helpDialog();break;
  case 'sources':helpDialog(true);break;
  case 'close-dialog':closeDialog();break;
  case 'search':searchDialog();break;
  case 'search-open':{const c=findChapter(cid);closeDialog();if(c)go('subject',c.subject.id,cid);break;}
  case 'menu':{const open=document.getElementById('sidebar').classList.toggle('is-open');document.getElementById('menu-backdrop').classList.toggle('is-open',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));document.getElementById('sidebar').inert=!open;if(open)document.querySelector('#sidebar .sidebar-close')?.focus();break;}
  case 'close-menu':closeMenu();document.getElementById('menu-toggle').focus();break;
  case 'skip':ev.preventDefault();document.getElementById('main').focus({preventScroll:true});break;
  case 'export':exportBackup();break;
  case 'csv':exportCSV();break;
  case 'import':if(demo)toast('Exit demo before importing a backup.','info');else document.getElementById('import-file').click();break;
  case 'restore-import':if(pendingImport){store=pendingImport;pendingImport=null;closeDialog();UI.category='All';UI.subjectQuery='';UI.openChapter=null;commit();render();toast('Your backup has been restored.');}break;
  case 'download-app':downloadApp();break;
  case 'demo':startDemo();break;
  case 'exit-demo':exitDemo();break;
  case 'reset':confirmDialog('A completely fresh start?',demo?'This resets only the sample data. Your own saved progress will not be affected.':'This removes all ratings, checkmarks, notes, custom chapters and preferences from this browser. Keep an exported backup if you may want them later.',()=>{store=freshState();UI.category='All';UI.subjectQuery='';UI.openChapter=null;commit();go('overview');toast('A fresh study space, ready for you.');},'Reset all data',true);break;
  case 'confirm':{const fn=pendingAction;pendingAction=null;closeDialog();if(fn)fn();break;}
}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.rating){const cid=t.dataset.rating;progress(cid,true).rating=Number(t.value);commit('rating',cid);render(true);}else if(t.dataset.topic){const cid=t.dataset.cid,p=progress(cid,true),tid=t.dataset.topic;if(t.checked){if(!p.done.includes(tid))p.done.push(tid);}else p.done=p.done.filter(x=>x!==tid);commit(t.checked?'topic':'',cid,tid);render(true);const c=findChapter(cid),a=chapterStats(c);if(t.checked&&a.done===a.total)toast('Every topic checked. Test yourself, then update your stars.','sprout');}else if(t.dataset.examType){const tid=t.dataset.examType;if(['mcq','cq','both'].includes(t.value))store.topicExamTypes[tid]=t.value;else delete store.topicExamTypes[tid];commit();render(true);}else if(t.id==='chapter-status'){UI.chapterStatus=t.value;render(true);}else if(t.id==='focus-subject'){UI.focusSubject=t.value;UI.focusLimit=30;render(true);}else if(t.id==='import-file'){importBackup(t.files[0]);}});
let searchTimer;
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.notes){progress(t.dataset.notes,true).notes=t.value;commit();}else if(t.id==='global-search'){searchResults(t.value);}else if(t.id==='subject-search'){UI.subjectQuery=t.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>render(true),120);}else if(t.id==='chapter-search'){UI.chapterQuery=t.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>render(true),120);}});
document.addEventListener('submit',ev=>{const f=ev.target;if(!['settings-form','add-chapter-form','add-topic-form','edit-chapter-form'].includes(f.id))return;ev.preventDefault();const form=new FormData(f);if(f.id==='settings-form'){store.profile.name=cleanText(form.get('name'),40);store.profile.dailyGoal=Math.max(1,Math.min(30,Number(form.get('dailyGoal'))||3));store.profile.theme=form.get('theme');store.profile.targetDate=form.get('targetDate');commit();closeDialog();render(true);toast('Your preferences are saved.');}else if(f.id==='add-chapter-form'){const sid=f.dataset.sid,id=uid(),titles=String(form.get('topics')).split('\n').map(t=>t.trim()).filter(Boolean).slice(0,50),title=cleanText(form.get('title'),250);if(!title||!titles.length){toast('Add a chapter name and at least one topic.','info');return;}const c={id,title,bn:cleanText(form.get('bn'),250),section:'Custom chapters',topics:titles.map(title=>({id:uid(),title:title.slice(0,500)}))};(store.customChapters[sid]||= []).push(c);UI.openChapter=id;UI.chapterStatus='all';UI.chapterQuery='';commit();closeDialog();render(true);requestAnimationFrame(()=>document.getElementById('chapter-'+id)?.scrollIntoView({behavior:'smooth',block:'start'}));toast('Your chapter has been added.');}else if(f.id==='add-topic-form'){const cid=f.dataset.cid,title=cleanText(form.get('title'));if(!title)return;(store.customTopics[cid]||=[]).push({id:uid(),title});commit();closeDialog();render(true);toast('A new topic, ready to track.');}else if(f.id==='edit-chapter-form'){const cid=f.dataset.cid,includes=[...f.querySelectorAll('[data-include]')];if(!includes.some(x=>x.checked)){toast('Keep at least one topic, or exclude the whole chapter.','info');return;}const title=cleanText(form.get('title'),250);if(!title){toast('Please enter a chapter name.','info');return;}store.chapterEdits[cid]={title,bn:cleanText(form.get('bn'),250)};for(const t of f.querySelectorAll('[data-topic-title]')){const value=cleanText(t.value);if(value)store.topicEdits[t.dataset.topicTitle]=value;}for(const t of includes){store.hiddenTopics=store.hiddenTopics.filter(x=>x!==t.dataset.include);if(!t.checked)store.hiddenTopics.push(t.dataset.include);}commit();closeDialog();render(true);toast('Outline updated. Your progress is kept.');}});
document.addEventListener('pointerover',ev=>{const label=ev.target.closest('.star-choice[data-star]');if(!label)return;const group=label.closest('.star-rating'),n=Number(label.dataset.star);group.querySelectorAll('.star-choice[data-star]').forEach(s=>{s.classList.toggle('preview',Number(s.dataset.star)<=n);s.classList.toggle('preview-off',Number(s.dataset.star)>n);});});
document.addEventListener('pointerout',ev=>{const group=ev.target.closest('.star-rating');if(!group||group.contains(ev.relatedTarget))return;group.querySelectorAll('.star-choice').forEach(s=>s.classList.remove('preview','preview-off'));});
document.addEventListener('keydown',ev=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');if((ev.key==='/'&&!typing)||((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k')){ev.preventDefault();searchDialog();}if(ev.key==='Escape'){const wasOpen=document.getElementById('sidebar').classList.contains('is-open');closeMenu();if(wasOpen)document.getElementById('menu-toggle').focus();}if(ev.key==='Tab'&&!dialog.open&&innerWidth<=960&&document.getElementById('sidebar').classList.contains('is-open')){const items=[...document.querySelectorAll('#sidebar button')].filter(b=>b.offsetWidth>0),first=items[0],last=items[items.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}if(ev.key==='ArrowDown'&&document.activeElement?.id==='global-search'){ev.preventDefault();document.querySelector('.search-result')?.focus();}});
dialog.addEventListener('click',ev=>{if(ev.target===dialog){const r=dialog.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)closeDialog();}});
dialog.addEventListener('close',()=>{document.body.style.overflow='';pendingAction=null;});
window.addEventListener('hashchange',()=>{render();finishNavigation();});
window.addEventListener('storage',ev=>{if(ev.key===KEY&&!demo&&ev.newValue){try{store=sanitize(JSON.parse(ev.newValue));render(true);toast('Progress updated from another tab.');}catch{}}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(store.profile.theme==='system')applyTheme();});
window.addEventListener('resize',()=>{document.getElementById('sidebar').inert=innerWidth<=960&&!document.getElementById('sidebar').classList.contains('is-open');if(innerWidth>960)closeMenu();});
load();
initCloud();
if(route().page==='subject')UI.openChapter=chaptersFor(route().sid)[0]?.id||null;
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
window.addEventListener('focus',()=>{if(cloudUser)setTimeout(()=>syncCloud(false),80);});

</script></body>
